name: Deploy Examples to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but do NOT cancel in-progress runs —
# cancelling a deployment mid-flight causes "Deployment failed, try again later".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Build examples
        run: pnpm exec vite build examples
        env:
          QUINTUS_BASE: /Quintus2/

      - name: Verify build output
        run: |
          test -f examples/dist/index.html
          test -f examples/dist/.nojekyll
          test -f examples/dist/platformer/index.html
          test -f examples/dist/platformer/assets/tileset.png
          test -f examples/dist/dungeon/assets/tileset.tsx
          test -f examples/dist/3d-dungeon/assets/models/floor.glb
          echo "Build verification passed"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
